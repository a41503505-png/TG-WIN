<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TG WIN — First Admin Setup</title><link rel="stylesheet" href="/style.css"></head>
<body><main><section class="panel" style="max-width:520px;margin:7vh auto"><p class="eyebrow">ONE-TIME SETUP</p><h1>Create TG WIN admin</h1><p class="hint">Use this page only after setting ADMIN_SETUP_SECRET in Cloudflare Pages. The first admin account can be created only once.</p>
<form id="setupForm" style="display:grid;gap:14px"><label>Setup secret<input id="secret" type="password" minlength="32" required autocomplete="off"></label><label>Admin username<input id="username" minlength="3" maxlength="24" required autocomplete="username"></label><label>Admin password (at least 12 characters)<input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="primary" type="submit">Create admin account</button></form><p id="status" role="status" class="hint"></p><p class="hint"><a href="/" style="color:#19c879">Back to TG WIN</a></p></section></main>
<script>
document.getElementById('setupForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Creating admin…';try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({secret:document.getElementById('secret').value,username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed');localStorage.setItem('tg_token',d.token);location.href='/';}catch(err){status.textContent=err.message;}});
</script></body></html>
